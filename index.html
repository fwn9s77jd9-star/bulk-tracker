<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bulk Tracker 80 → 85 kg</title>
<style>
:root{--bg:#fff;--card:#f6f6f6;--text:#000;--muted:#6a6a6a;--accent:#000;--accentbg:#e4e4e4;--line:#d8d8d8;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111;--text:#fff;--muted:#9a9a9a;--accent:#fff;--accentbg:#262626;--line:#2a2a2a;--onacc:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#111;--text:#fff;--muted:#9a9a9a;--accent:#fff;--accentbg:#262626;--line:#2a2a2a;--onacc:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:15px;margin:20px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:10px;background:var(--accentbg);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.it input:checked+span{color:var(--muted);text-decoration:line-through}
.muted{color:var(--muted);font-size:14px}
input.num{width:92px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:right}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:8px}
.wk:last-child{border-bottom:0}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--accentbg);color:var(--accent);white-space:nowrap}
.tag.now{background:var(--accent);color:var(--onacc)}
.ok{color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{font-size:14px;padding:8px 12px;border-radius:20px}
.msg{padding:10px 12px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap;max-width:92%;overflow-wrap:anywhere}
.msg.user{background:var(--accent);color:var(--onacc);margin-left:auto}
.msg.assistant{background:var(--card);border:1px solid var(--line)}
.ask{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
textarea{flex:1;font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);resize:none;min-height:46px}
button:disabled{opacity:.5}
.big{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1{font-size:26px;letter-spacing:-.02em}
.bar{height:8px}
button:active{opacity:.6}
.tbtn{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px}
.g{stroke:var(--line)}.tl{stroke:var(--muted);fill:none;stroke-dasharray:4 4;stroke-width:1.5}
.al{stroke:var(--text);fill:none;stroke-width:2.5;stroke-linejoin:round}.dot{fill:var(--text)}
svg text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.strip{display:flex;justify-content:space-between;margin:12px 0 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:none;border:0;padding:0}
.day i{font-style:normal;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text);border:2px dashed var(--line)}
.day.has i{border:2px solid var(--text)}
.day.sel i{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.hero{display:flex;justify-content:space-between;align-items:center}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.mc b{display:block;font-size:20px}.mc span{font-size:12px;color:var(--muted)}
.meal{display:flex;gap:12px;align-items:center}
.meal img,.ph{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--accentbg);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--onacc);font-size:30px;border:0;box-shadow:0 4px 18px rgba(0,0,0,.45);padding:0;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;border:1px solid var(--line)}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:16px;margin-bottom:10px;background:var(--card)}
.opt>b{font-size:26px}
.fld{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
input.txt{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.num2{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.gauge{position:relative;height:16px;background:var(--accentbg);border-radius:8px;margin-top:14px}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
.gauge b{position:absolute;top:-5px;width:3px;height:26px;background:var(--muted);border-radius:2px}
.mbar{margin:12px 0}.mbar .bar{margin-top:5px;height:6px}
.mrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.mrow img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.warnbox{border:1px solid var(--text);border-radius:12px;padding:10px;margin:0 0 10px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="photo" hidden>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<button class="fab" id="fab" data-sheet="open" aria-label="Add food">+</button>
<nav id="nav"></nav>
<script>
var START=new Date(2026,9,12);
var T=[80.4,80.8,81.3,81.7,82.1,82.5,82.9,83.3,83.8,84.2,84.6,85.0];
var DAILY=["Eat 4–5 meals (about 3,000+ kcal)","Hit protein target (150–160 g)","Drink 2.5–3 litres of water","Sleep 7–8 hours","Halal protein source at every meal","Lifting session done (on training days)"];
var WEEKLY=["Sunday: supermarket / halal butcher shop","Sunday: cook and portion rice, chicken, mince","Sunday: freeze extra meat in portions","Check labels: gelatine, alcohol flavourings, rennet","Plan this week's 3–4 training days","Weigh in 2–3 mornings and record the average","Compare to target and adjust calories if needed"];
var SHOP=["Protein: halal chicken 2 kg, mince 1 kg, lamb/beef 0.5–1 kg, eggs 30, tuna/salmon/sardines, Greek yoghurt, skyr, cottage cheese, whole milk 4–6 L, halal-certified whey","Carbs: oats 1 kg+, rice 2 kg, wholewheat pasta, potatoes, sweet potatoes, wholemeal bread/wraps, bananas, dates, berries, lentils, chickpeas, tinned beans","Fats: olive oil, peanut/almond butter, mixed nuts, avocados, chia or flax","Veg: spinach, broccoli, peppers, tomatoes, onions, carrots","Flavour: garlic, ginger, cumin, paprika, turmeric, pepper, chilli, passata"];
var SHOPCAT=[
["🥩 Protein (halal)",["Halal chicken breast and thighs (2 kg)","Halal minced beef, 5–10% fat (1 kg)","Halal lamb or beef steak / diced meat (0.5–1 kg)","Eggs (30)","Tinned tuna, salmon and sardines, or fresh salmon / white fish","Greek yoghurt","High-protein skyr","Cottage cheese","Whole milk (4–6 litres)","Whey protein (halal-certified, gelatine-free)"]],
["🍚 Carbs",["Oats (1 kg or more)","Basmati or brown rice (2 kg)","Wholewheat pasta","Potatoes","Sweet potatoes","Wholemeal bread, wraps and pitta","Bananas","Dates","Apples","Berries","Dried lentils and chickpeas","Tinned beans"]],
["🥑 Healthy fats",["Olive oil","Peanut or almond butter (no added sugar)","Mixed nuts and almonds","Avocados","Chia or flax seeds"]],
["🥦 Veg",["Spinach","Broccoli","Peppers","Tomatoes","Onions","Carrots"]],
["🧂 Flavour",["Garlic and ginger","Cumin, paprika, turmeric, black pepper, chilli","Passata or tinned tomatoes"]],
["☪️ Halal label check",["Check labels for gelatine, alcohol-based flavourings and non-halal rennet in cheese"]]];
var PHASES=[
["Phase 1: Weeks 1–4 (12 Oct – 8 Nov): Get into the routine",["Start at about 3,000 kcal a day","Build the Sunday shop and meal prep habit","Start a lifting programme, 3–4 days a week","Log every weigh-in","Week 4 weight about 81.7 kg"]],
["Phase 2: Weeks 5–8 (9 Nov – 6 Dec): Keep building",["Increase gym weights whenever you can","Review calories at end of weeks 4 and 6","Add about 100 kcal a day as weight rises","Week 8 weight about 83.3 kg"]],
["Phase 3: Weeks 9–12 (7 Dec – 3 Jan): Finish strong",["Stay consistent even if appetite drops","Use liquid calories (milk, shakes, dates)","Review calories at end of week 10","Week 12 weight reaches 85 kg"]],
["Finish line: 4–7 Jan",["Take a final weigh-in average","Take a progress photo and compare to the start","Decide: maintain (cut about 300–400 kcal) or keep bulking"]]];
var RULES=[["Under 0.25 kg / week","Add about 200 kcal a day (rice, nut butter, olive oil, whole milk)"],["0.25–0.5 kg / week","Stay the course"],["Over 0.5 kg / week","Cut about 150–200 kcal a day"],["Strength stuck 2+ weeks","Check sleep, protein and training programme"]];

var S={c:{},w:{}};
try{var raw=localStorage.getItem('bulk-v1');if(raw){S=JSON.parse(raw)||S}}catch(e){}
S.c=S.c||{};S.w=S.w||{};S.m=S.m||{};S.f=S.f||{};
var TH='dark';try{TH=localStorage.getItem('bulk-theme')||'dark'}catch(e){}
function applyTh(){document.documentElement.setAttribute('data-theme',TH)}
applyTh();
function save(){try{localStorage.setItem('bulk-v1',JSON.stringify(S))}catch(e){}}

function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function curWeek(){var d=Math.floor((new Date()-START)/864e5);var n=Math.floor(d/7)+1;return Math.max(1,Math.min(12,n))}
function wkStart(n){return new Date(START.getTime()+(n-1)*7*864e5)}
function fmt(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function latest(){for(var n=12;n>=1;n--){var v=parseFloat(S.w[n]);if(v>0)return {n:n,v:v}}return null}

var tab='today',vw=curWeek();
var sel=dkey(new Date()),M={mode:'menu'},IMG=false,CAM=null,RC=[],SLOT=2,GOAL={k:3100,p:155,c:400,f:85};

function items(list,prefix){
  return list.map(function(t,i){var k=prefix+i;
    return '<label class="it"><input type="checkbox" data-k="'+k+'"'+(S.c[k]?' checked':'')+'><span>'+t+'</span></label>'}).join('');
}
function count(list,prefix){var d=0;list.forEach(function(_,i){if(S.c[prefix+i])d++});return d}
function wInput(n){return '<input class="num" type="number" inputmode="decimal" step="0.1" min="30" max="200" placeholder="kg" data-w="'+n+'" value="'+(S.w[n]||'')+'">'}

function header(){
  var l=latest(),cur=l?l.v:80,pct=Math.max(0,Math.min(100,(cur-80)/5*100));
  return '<div class="card"><div class="row"><div><div class="muted">Current weight</div><div class="big">'+cur.toFixed(1)+' kg</div></div>'+
  '<div style="text-align:right"><div class="muted">Goal</div><div class="big">85 kg</div></div></div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
  '<div class="muted" style="margin-top:6px">'+(85-cur>0?(85-cur).toFixed(1)+' kg to go':'Goal reached! 🎉')+'</div></div>';
}

function themeBtn(){return '<button class="tbtn" data-theme-btn aria-label="Switch theme">'+(TH==='dark'?'☀︎':'☾')+'</button>'}
function streak(){var n=0,d=new Date();var c=function(x){return (S.f[dkey(x)]||[]).length>0};if(!c(d))d.setDate(d.getDate()-1);while(c(d)&&n<400){n++;d.setDate(d.getDate()-1)}return n}
function streakChip(){return '<span class="tag" style="font-size:14px;padding:6px 10px">🔥 '+streak()+'</span>'}
function macroCard(){
  var d=S.m[dkey(new Date())]||{},k=d.k||0,p=d.p||0;
  function r(lbl,key,val,goal,unit){return '<div style="margin-top:12px"><div class="row"><span>'+lbl+' <span class="muted">/ '+goal+unit+'</span></span><input class="num" type="number" inputmode="numeric" min="0" placeholder="0" data-m="'+key+'" value="'+(val||'')+'"></div><div class="bar"><i style="width:'+Math.min(100,val/goal*100)+'%"></i></div></div>'}
  return '<div class="card"><b>Today\'s intake</b><div class="muted">Enter your running total for the day.</div>'+r('Calories','k',k,3100,' kcal')+r('Protein','p',p,155,' g')+'</div>';
}
function chart(){
  var W=320,H=180,pl=30,pr=10,pt=10,pb=22;
  var x=function(i){return pl+i*(W-pl-pr)/12},y=function(v){return pt+(85.5-v)*(H-pt-pb)/6};
  var g='',i;
  for(i=80;i<=85;i++)g+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(i)+'" y2="'+y(i)+'"/><text x="'+(pl-6)+'" y="'+(y(i)+3)+'" text-anchor="end">'+i+'</text>';
  for(i=0;i<=12;i+=2)g+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+(i?'W'+i:'Start')+'</text>';
  var tp='M'+x(0)+','+y(80)+T.map(function(v,j){return 'L'+x(j+1)+','+y(v)}).join('');
  var pts=[{i:0,v:80}];for(i=1;i<=12;i++){var v=parseFloat(S.w[i]);if(v>0)pts.push({i:i,v:v})}
  var ap=pts.map(function(q,j){return (j?'L':'M')+x(q.i)+','+y(Math.max(79.5,Math.min(85.5,q.v)))}).join('');
  var dots=pts.map(function(q){return '<circle class="dot" r="3.5" cx="'+x(q.i)+'" cy="'+y(Math.max(79.5,Math.min(85.5,q.v)))+'"/>'}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weight progress chart">'+g+'<path class="tl" d="'+tp+'"/><path class="al" d="'+ap+'"/>'+dots+'</svg><div class="legend"><span>━ Actual</span><span>┅ Target</span></div>';
}
function tot(k){return (S.f[k]||[]).reduce(function(a,m){a.k+=m.k||0;a.p+=m.p||0;a.c+=m.c||0;a.f+=m.f||0;return a},{k:0,p:0,c:0,f:0})}
function ring(pct,size,sw,ico){
  var r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,Math.max(0,pct)/100)),h=size/2;
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;display:inline-block"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)"><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke-width="'+sw+'" style="stroke:var(--accentbg)"/><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="stroke:var(--accent)"/></svg><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:'+Math.round(size*.32)+'px">'+ico+'</span></div>';
}
var SLOTS=[['Breakfast','🌅',750,'Oats in milk, banana, peanut butter, 3 eggs'],['Lunch','🍗',850,'Chicken, rice, veg and olive oil'],['Snack','🥜',450,'Greek yoghurt, dates and a handful of nuts'],['Dinner','🥩',750,'Mince or steak, potato or pasta, avocado salad'],['Before bed','🥛',300,'Cottage cheese or skyr with berries']];
function slotOf(m){if(m.s!=null)return m.s;var h=parseInt(String(m.t||'12').split(':')[0])||12;return h<11?0:h<15?1:h<18?2:h<22?3:4}
function slotNow(){var h=new Date().getHours();return h<11?0:h<15?1:h<18?2:h<22?3:4}
function recents(){var all=[];Object.keys(S.f).forEach(function(d){(S.f[d]||[]).forEach(function(m){all.push(m)})});all.sort(function(a,b){return b.id-a.id});var seen={},out=[];all.forEach(function(m){var k=String(m.n).toLowerCase();if(!seen[k]&&out.length<5){seen[k]=1;out.push(m)}});RC=out;return out}
function bars(){
  var W=320,H=150,pl=8,pb=20,pt=16,days=[],i,on=0;
  for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push({l:'SMTWTFS'.charAt(d.getDay()),k:tot(dkey(d)).k})}
  var mx=Math.max(GOAL.k*1.15,Math.max.apply(null,days.map(function(x){return x.k}))),y=function(v){return pt+(H-pt-pb)*(1-v/mx)},cw=(W-2*pl)/7,g='';
  days.forEach(function(d,j){var x=pl+j*cw+(cw-26)/2,hit=d.k>=GOAL.k*.9;if(hit)on++;
    g+='<rect x="'+x+'" y="'+y(d.k)+'" width="26" height="'+Math.max(2,H-pb-y(d.k))+'" rx="5" style="fill:'+(hit?'var(--text)':'var(--accentbg)')+'"/><text x="'+(x+13)+'" y="'+(H-6)+'" text-anchor="middle">'+d.l+'</text>'+(d.k?'<text x="'+(x+13)+'" y="'+(y(d.k)-4)+'" text-anchor="middle">'+Math.round(d.k/100)/10+'k</text>':'')});
  return '<div class="row" style="margin-bottom:6px"><b>'+on+'/7 days on target</b><span class="muted">goal '+GOAL.k.toLocaleString()+' kcal</span></div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Calories over the last 7 days"><line class="g" x1="'+pl+'" x2="'+(W-pl)+'" y1="'+y(GOAL.k)+'" y2="'+y(GOAL.k)+'" style="stroke-dasharray:4 4"/>'+g+'</svg>';
}
function viewToday(){
  var now=new Date(),n=curWeek(),dow=(now.getDay()+6)%7,td=dkey(now),t=tot(sel),meals=S.f[sel]||[],strip='',i,isT=sel===td;
  for(i=0;i<7;i++){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i),k=dkey(d);
    strip+='<button class="day'+((S.f[k]||[]).length?' has':'')+(k===sel?' sel':'')+'" data-day="'+k+'">'+'MTWTFSS'.charAt(i)+'<i>'+d.getDate()+'</i></button>'}
  var hr=now.getHours()+now.getMinutes()/60,exp=Math.round(GOAL.k*Math.min(1,Math.max(0,(hr-7)/15))),pct=Math.min(100,t.k/GOAL.k*100);

  SHOPCAT.forEach(function(c){
    var rows=c[1].map(function(t){var k=pre+idx;idx++;tot++;if(S.c[k])done++;
      return '<label class="it"><input type="checkbox" data-k="'+k+'"'+(S.c[k]?' checked':'')+'><span>'+t+'</span></label>'}).join('');
    h+='<div class="card"><b>'+c[0]+'</b>'+rows+'</div>'});
  return '<h1>Shopping list</h1><p class="sub">Week '+n+' · weekly amounts · tick items as you put them in the basket</p>'+
  '<div class="card"><div class="row"><b>Basket</b><span class="tag">'+done+'/'+tot+'</span></div><div class="bar"><i style="width:'+Math.round(done/tot*100)+'%"></i></div></div>'+h+
  '<div class="card row"><span class="muted">Starting a new shop?</span><button data-clear>Untick all</button></div>';
}
var TABS=[['today','🏠','Home'],['week','✅','Week'],['shop','🛒','Shop'],['coach','🤖','Coach'],['tracker','📈','Progress']];
function render(keepScroll){
  var y=window.scrollY;
  var v={today:viewToday,week:viewWeek,shop:viewShop,coach:viewCoach,tracker:function(){return viewTracker()+viewPlan()}}[tab]();
  document.getElementById('app').innerHTML=v;
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');
  document.getElementById('fab').style.display=tab==='today'?'block':'none';
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
}

document.addEventListener('click',function(e){
  if(e.target.id==='ov'){closeSheet();return}
  var sh=e.target.closest('[data-sheet]');if(sh){sheetAct(sh.getAttribute('data-sheet'));return}
  var sl=e.target.closest('[data-slot]');if(sl){SLOT=parseInt(sl.getAttribute('data-slot'));M={mode:'menu'};drawSheet();return}
  var rp=e.target.closest('[data-rep]');if(rp){var m0=RC[parseInt(rp.getAttribute('data-rep'))];if(m0){var c0={};for(var q in m0)c0[q]=m0[q];c0.id=Date.now();c0.t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});c0.s=SLOT;(S.f[sel]=S.f[sel]||[]).push(c0);save();closeSheet();render(true)}return}
  var dy=e.target.closest('[data-day]');if(dy){sel=dy.getAttribute('data-day');render(true);return}
  var dl=e.target.closest('[data-del]');if(dl){var id=dl.getAttribute('data-del');S.f[sel]=(S.f[sel]||[]).filter(function(m){return String(m.id)!==id});save();render(true);return}
  var t=e.target.closest('[data-tab]');if(t){tab=t.getAttribute('data-tab');if(tab==='week')vw=curWeek();render();return}
  var nv=e.target.closest('[data-nav]');if(nv){vw=Math.max(1,Math.min(12,vw+parseInt(nv.getAttribute('data-nav'))));render();return}
  if(e.target.closest('[data-theme-btn]')){TH=TH==='dark'?'light':'dark';try{localStorage.setItem('bulk-theme',TH)}catch(x){}applyTh();render(true);return}
  var go=e.target.closest('[data-go]');if(go){tab=go.getAttribute('data-go');render();return}
  if(e.target.closest('[data-clear]')){var pf='sh:'+curWeek()+':';Object.keys(S.c).forEach(function(k){if(k.indexOf(pf)===0)delete S.c[k]});save();render(true);return}
  var qa=e.target.closest('[data-ask]');if(qa){ask(QUICK[parseInt(qa.getAttribute('data-ask'))][1]);return}
  if(e.target.id==='send'){var ta=document.getElementById('q');ask(ta?ta.value:'');return}
  if(e.target.id==='pxsave'){var pv=(document.getElementById('px').value||'').trim();try{if(pv)localStorage.setItem('bulk-proxy',pv);else localStorage.removeItem('bulk-proxy')}catch(x){}location.reload();return}
  if(e.target.id==='reset'){if(confirm('Clear all checklists and weights?')){S={c:{},w:{},m:{},f:{}};save();render()}}
});
document.addEventListener('change',function(e){
  if(e.target.id==='photo'||e.target.id==='cam'){var pf=e.target.files&&e.target.files[0];e.target.value='';if(pf&&SAMPLE)analyze(pf,null);return}
  var k=e.target.getAttribute('data-k');
  if(k){if(e.target.checked)S.c[k]=1;else delete S.c[k];save();render(true);return}
  var m=e.target.getAttribute('data-m');
  if(m){var dk=dkey(new Date());S.m[dk]=S.m[dk]||{};var mv=parseFloat(e.target.value);if(mv>0)S.m[dk][m]=mv;else delete S.m[dk][m];save();render(true);return}
  var w=e.target.getAttribute('data-w');
  if(w){var v=e.target.value.trim();if(v)S.w[w]=v;else delete S.w[w];save();render(true)}
});
render();
</script>
